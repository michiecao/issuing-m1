<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 240" width="540" height="240">
  <defs>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <clipPath id="bgClip">
      <rect width="540" height="240" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <!-- Light gray background -->
  <rect width="540" height="240" rx="12" ry="12" fill="#e3e8ee"/>

  <!-- Terminal window -->
  <g transform="translate(30, 20)" filter="url(#termShadow)">
    <rect width="480" height="210" rx="12" ry="12" fill="#1a1f36"/>

    <!-- Traffic light dots -->
    <circle cx="20" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="48" cy="22" r="5" fill="#28ca42"/>
    <text x="68" y="26" font-family="SF Mono, Fira Code, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6b7280">Terminal</text>

    <!-- Code content -->
    <g transform="translate(20, 50)" font-family="SF Mono, Fira Code, Menlo, Monaco, Consolas, monospace" font-size="12">
      <!-- $ stripe issuing cards create \ -->
      <text y="0">
        <tspan fill="#a5f3ab">$</tspan>
        <tspan fill="#e2e8f0"> stripe issuing cards create </tspan>
        <tspan fill="#94a3b8">\</tspan>
      </text>

      <!--   --cardholder="ich_1MsKY81CEjIa" \ -->
      <text y="20">
        <tspan fill="#e2e8f0" xml:space="preserve">  </tspan>
        <tspan fill="#60a5fa">--cardholder</tspan>
        <tspan fill="#94a3b8">=</tspan>
        <tspan fill="#a5f3ab">"ich_1MsKY81CEjIa"</tspan>
        <tspan fill="#e2e8f0"> </tspan>
        <tspan fill="#94a3b8">\</tspan>
      </text>

      <!--   --type="virtual" \ -->
      <text y="40">
        <tspan fill="#e2e8f0" xml:space="preserve">  </tspan>
        <tspan fill="#60a5fa">--type</tspan>
        <tspan fill="#94a3b8">=</tspan>
        <tspan fill="#a5f3ab">"virtual"</tspan>
        <tspan fill="#e2e8f0"> </tspan>
        <tspan fill="#94a3b8">\</tspan>
      </text>

      <!--   --currency="usd" -->
      <text y="60">
        <tspan fill="#e2e8f0" xml:space="preserve">  </tspan>
        <tspan fill="#60a5fa">--currency</tspan>
        <tspan fill="#94a3b8">=</tspan>
        <tspan fill="#a5f3ab">"usd"</tspan>
      </text>

      <!-- JSON response -->
      <text y="90" fill="#6b7280">{</text>
      <text y="110" fill="#6b7280" xml:space="preserve">  "id": "ic_1MsKY81CEjIaSs",</text>
      <text y="130" fill="#6b7280" xml:space="preserve">  "type": "virtual",</text>
      <text y="150" fill="#6b7280" xml:space="preserve">  "status": "active"</text>
    </g>
  </g>
</svg>
