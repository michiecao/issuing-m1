<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="520" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8D8EA"/>
      <stop offset="35%" stop-color="#C4B5F0"/>
      <stop offset="100%" stop-color="#B8A4E8"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect width="520" height="520" rx="12"/>
    </clipPath>
    <clipPath id="header-clip">
      <rect x="20" y="20" width="480" height="160" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- White card background -->
    <rect width="520" height="520" rx="12" fill="white"/>

    <!-- Gradient header -->
    <g clip-path="url(#header-clip)">
      <rect x="20" y="20" width="480" height="160" rx="12" fill="url(#header-gradient)"/>
    </g>

    <!-- Checkmark circle -->
    <circle cx="260" cy="100" r="28" fill="white"/>
    <path d="M247 100L255 108L273 90" stroke="#675DFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Heading: You're ready to create your first card -->
    <text x="40" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#353A44" letter-spacing="-0.3">You're ready to create your first card</text>

    <!-- Description paragraph -->
    <text x="40" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#596171" letter-spacing="-0.15">
      <tspan x="40" dy="0">You can start creating cards and tracking expenses in your</tspan>
      <tspan x="40" dy="22">redesigned Balances page.</tspan>
    </text>

    <!-- "Here's what's new:" -->
    <text x="40" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#596171" letter-spacing="-0.15">Here's what's new:</text>

    <!-- Feature highlight: Financial accounts -->
    <!-- Icon background -->
    <rect x="40" y="342" width="48" height="48" rx="8" fill="#F7F5FD"/>

    <!-- Financial accounts icon (horizontal bars + circle) -->
    <path d="M52 354C52 353.586 52.336 353.25 52.75 353.25H60.25C60.664 353.25 61 353.586 61 354C61 354.414 60.664 354.75 60.25 354.75H52.75C52.336 354.75 52 354.414 52 354Z" fill="#675DFF"/>
    <path d="M52 362C52 361.586 52.336 361.25 52.75 361.25H58.75C59.164 361.25 59.5 361.586 59.5 362C59.5 362.414 59.164 362.75 58.75 362.75H52.75C52.336 362.75 52 362.414 52 362Z" fill="#675DFF"/>
    <path d="M54.5 357.25C54.086 357.25 53.75 357.586 53.75 358C53.75 358.414 54.086 358.75 54.5 358.75H61.5C61.914 358.75 62.25 358.414 62.25 358C62.25 357.586 61.914 357.25 61.5 357.25H54.5Z" fill="#675DFF"/>
    <path d="M53.75 370C53.75 369.586 54.086 369.25 54.5 369.25H58.5C58.914 369.25 59.25 369.586 59.25 370C59.25 370.414 58.914 370.75 58.5 370.75H54.5C54.086 370.75 53.75 370.414 53.75 370Z" fill="#675DFF"/>
    <circle cx="67" cy="367" r="4" stroke="#675DFF" stroke-width="1.5" fill="none"/>
    <circle cx="67" cy="367" r="2" stroke="#675DFF" stroke-width="1.5" fill="none"/>

    <!-- Feature title -->
    <text x="100" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#353A44">Financial accounts</text>

    <!-- Feature description -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#596171">
      <tspan x="100" y="378">Your cards spend from your financial account balance.</tspan>
      <tspan x="100" dy="20">You can also store funds in multiple currencies and</tspan>
      <tspan x="100" dy="20">send payouts.</tspan>
    </text>

    <!-- Go to Balances button -->
    <rect x="40" y="445" width="440" height="44" rx="6" fill="#675DFF"/>
    <text x="260" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">Go to Balances</text>
  </g>

  <!-- Card border -->
  <rect x="0.5" y="0.5" width="519" height="519" rx="11.5" stroke="#E3E8EE"/>
</svg>
